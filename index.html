<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centered counter</title>
    <script type="module" crossorigin src="/centered_counter/assets/index-5x5m9b_C.js"></script>
    <link rel="stylesheet" crossorigin href="/centered_counter/assets/index-b6X1Z_Mr.css">
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">Interactive Counter</h1>
      <form class="controls" aria-labelledby="controls-heading">
        <h2 id="controls-heading" class="visually-hidden">Counter Controls</h2>
        <div class="control">
          <label for="start_at">Start at</label>
          <input
            type="number"
            name="start_at"
            id="start_at"
            value="0"
            min="0"
            step="1"
            required
            aria-describedby="start-at-description"
          />
          <p id="start-at-description" class="visually-hidden">
            Enter the starting value for the counter
          </p>
        </div>
        <div class="control">
          <label for="step">Step</label>
          <input
            type="number"
            name="step"
            id="step"
            value="1"
            min="1"
            step="1"
            required
            aria-describedby="step-description"
          />
          <p id="step-description" class="visually-hidden">
            Enter the step value for incrementing the counter
          </p>
        </div>
      </form>
      <section class="counter-display" aria-labelledby="counter-heading">
        <h2 id="counter-heading" class="visually-hidden">Counter Display</h2>
        <button id="count_button" aria-live="polite" aria-label="Increment counter">
          <span id="current_count" aria-label="Current count">0</span>
        </button>
      </section>
    </main>
  </body>
</html>
